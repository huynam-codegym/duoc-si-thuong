name: Deploy lên GitHub Pages

on:
  push:
    branches: [main]
  # PR (ví dụ Dependabot cập nhật thư viện) chỉ build thử để biết có hỏng không, không deploy
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Chỉ giữ một lần deploy chạy tại một thời điểm; build thử của PR chạy nhóm riêng, không hủy deploy thật
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          node-version: 24
        env:
          # Đăng nhập/tài khoản khách (Supabase) — khóa "anon/publishable", không phải bí mật, nhưng
          # vẫn lấy từ Repository variables (Settings > Secrets and variables > Actions > Variables)
          # thay vì viết thẳng vào code, theo đúng quy ước "dùng biến môi trường" của dự án.
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
          # Cloudflare Turnstile (chống spam đơn) — khóa site công khai, để trống thì không hiện ô xác minh.
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
